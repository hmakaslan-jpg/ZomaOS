plugins { id 'com.android.application' }
android {
    namespace 'com.zoma.os'
    compileSdk 35
    defaultConfig {
        applicationId 'com.zoma.os'
        minSdk 16
        targetSdk 22
        versionCode 59
        versionName '15.9'
    }
    signingConfigs {
        release {
            if (System.getenv('ZOMAOS_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ZOMAOS_KEYSTORE_PATH'))
                storePassword System.getenv('ZOMAOS_STORE_PASSWORD')
                keyAlias System.getenv('ZOMAOS_KEY_ALIAS')
                keyPassword System.getenv('ZOMAOS_KEY_PASSWORD')
                storeType 'PKCS12'
                v1SigningEnabled true
                v2SigningEnabled false
            }
        }
    }
    lint {
        disable 'ExpiredTargetSdkVersion', 'MockLocation'
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
