
name: Build ZomaOS V16 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify theme images
        run: |
          ls -la app/src/main/res/drawable-nodpi/
          for name in master_electric master_pearl master_carbon master_night_pro master_pearl_digital master_pearl_luxury; do
            test -f "app/src/main/res/drawable-nodpi/${name}.jpg" || exit 1
          done

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZomaOS_V16_Debug_APK
          path: app/build/outputs/apk/debug/app-debug.apk
