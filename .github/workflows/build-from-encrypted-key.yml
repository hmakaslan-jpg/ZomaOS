name: Build ZomaOS signed APK from encrypted backup
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Android SDK: $ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Remove baked OBD symbol from the three original theme images
        shell: bash
        run: |
          python3 -m pip install --quiet Pillow numpy opencv-python-headless
          python3 - <<'PYREPAIR'
          from PIL import Image, ImageFilter
          from pathlib import Path
          root=Path('app/src/main/res/drawable-nodpi')
          for theme in ('carbon','electric','pearl'):
              path=root/('master_'+theme+'.jpg')
              original=Image.open(path).convert('RGB')
              repaired=original.copy()
              src=original.load()
              dst=repaired.load()
              x0,x1,y0,y1=536,610,389,448
              if theme=='pearl':
                  # Day only: remove the actual dark engine strokes by inpainting,
                  # then soften only the center of the repaired button.
                  # Do not alter the button's silver perimeter or blue glow.
                  import cv2
                  import numpy as np
                  rgb=np.asarray(original)
                  im=cv2.cvtColor(rgb,cv2.COLOR_RGB2BGR)
                  gray=cv2.cvtColor(im,cv2.COLOR_BGR2GRAY)
                  mask=np.zeros(gray.shape,np.uint8)
                  mask[389:446,532:617]=np.uint8(gray[389:446,532:617]<130)*255
                  mask=cv2.dilate(mask,np.ones((5,5),np.uint8))
                  repaired_cv=cv2.inpaint(im,mask,10,cv2.INPAINT_TELEA)
                  softened=cv2.GaussianBlur(repaired_cv,(25,25),7)
                  Y,X=np.mgrid[:480,:800]
                  rr=((X-574)/39.)**2+((Y-418)/29.)**2
                  alpha=np.clip((1.10-rr)/.5,0,1)
                  alpha=alpha*alpha*(3-2*alpha)
                  fixed=np.uint8(np.clip(repaired_cv*(1-alpha[:,:,None])+softened*alpha[:,:,None],0,255))
                  result=Image.fromarray(cv2.cvtColor(fixed,cv2.COLOR_BGR2RGB))
              else:
                  for y in range(y0,y1):
                      left=[sum(src[xx,y][c] for xx in range(525,533))/8 for c in range(3)]
                      right=[sum(src[xx,y][c] for xx in range(614,622))/8 for c in range(3)]
                      for x in range(x0,x1):
                          t=(x-x0)/(x1-x0)
                          dst[x,y]=tuple(round(left[c]*(1-t)+right[c]*t) for c in range(3))
              if theme!='pearl':
                  mask=Image.new('L',original.size,0)
                  from PIL import ImageDraw
                  ImageDraw.Draw(mask).rectangle((x0,y0,x1-1,y1-1),fill=255)
                  mask=mask.filter(ImageFilter.GaussianBlur(11 if theme=='pearl' else 2.2))
                  result=Image.composite(repaired,original,mask)
              result.save(path,quality=83,subsampling=2,optimize=True)
              print('Clean theme',theme,path.stat().st_size)
          PYREPAIR
      - name: Enforce clean source resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCLEAN'
          from pathlib import Path
          import shutil
          root=Path('app/src/main')
          allowed={'master_carbon.jpg','master_electric.jpg','master_pearl.jpg','zoma_icon.png'}
          res=root/'res'
          for p in sorted(res.rglob('*'),reverse=True):
              if p.is_file() and not (p.parent==res/'drawable-nodpi' and p.name in allowed):
                  print('Pruning legacy resource:',p)
                  p.unlink()
          for p in sorted(res.rglob('*'),reverse=True):
              if p.is_dir() and not any(p.iterdir()):p.rmdir()
          themes=root/'assets'/'themes'
          if themes.exists():
              print('Removing duplicate theme assets:', themes)
              shutil.rmtree(themes)
          assert not themes.exists(), 'Duplicate theme directory still exists'
          java=root/'java'
          for p in java.rglob('*.java'):
              if p.relative_to(java).as_posix()!='com/zoma/os/MainActivity.java':
                  print('Pruning legacy Java:',p)
                  p.unlink()
          found={p.name for p in (res/'drawable-nodpi').iterdir() if p.is_file()}
          assert found==allowed, f'Unexpected resource set: {found}'
          print('Clean resources verified:',sorted(found))
          PYCLEAN
      - name: Retrieve encrypted backup and unlock locally on runner
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_PASSWORD: ${{ secrets.ZOMAOS_BACKUP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$BACKUP_PASSWORD" || { echo 'Missing ZOMAOS_BACKUP_PASSWORD secret'; exit 1; }
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow generate-signing-key.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID" || { echo 'No successful key-generation run found'; exit 1; }
          mkdir -p "$RUNNER_TEMP/signing"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name ZomaOS-encrypted-signing-key-backup --dir "$RUNNER_TEMP/signing"
          cd "$RUNNER_TEMP/signing"
          printf '%s' "$BACKUP_PASSWORD" | openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 200000 -in zomaos-signing-backup.tar.gz.enc -out signing-backup.tar.gz -pass stdin
          tar -xzf signing-backup.tar.gz
          test -s zomaos-release.p12 && test -s signing-info.txt
          source signing-info.txt
          {
            echo "ZOMAOS_KEYSTORE_PATH=$RUNNER_TEMP/signing/zomaos-release.p12"
            echo "ZOMAOS_STORE_PASSWORD=$ZOMAOS_RELEASE_STORE_PASSWORD"
            echo "ZOMAOS_KEY_ALIAS=$ZOMAOS_RELEASE_KEY_ALIAS"
            echo "ZOMAOS_KEY_PASSWORD=$ZOMAOS_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$ZOMAOS_RELEASE_STORE_PASSWORD"
          echo "::add-mask::$ZOMAOS_RELEASE_KEY_PASSWORD"
          rm -f signing-backup.tar.gz signing-info.txt
      - name: Build with Android Gradle Plugin
        run: gradle --no-daemon clean assembleRelease
      - name: Verify Android 4 compatible v1 signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --min-sdk-version 16 "$APK" | tee /tmp/signature.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/signature.txt
          "$AAPT" dump badging "$APK" | head -n 5
          sha256sum "$APK" > app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: ZomaOS-V15_8-signed-legacy-test
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          retention-days: 30
