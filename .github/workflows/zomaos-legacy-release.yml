name: ZomaOS legacy-compatible signed release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Check signing secrets
        env:
          STORE_B64: ${{ secrets.ZOMAOS_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ZOMAOS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZOMAOS_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ZOMAOS_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$STORE_B64" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS" || { echo 'Signing secrets are missing'; exit 1; }
      - name: Restore signing keystore
        env:
          STORE_B64: ${{ secrets.ZOMAOS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/zomaos-release.p12"
          chmod 600 "$RUNNER_TEMP/zomaos-release.p12"
      - name: Build release APK with Android Gradle Plugin
        env:
          ZOMAOS_KEYSTORE_PATH: ${{ runner.temp }}/zomaos-release.p12
          ZOMAOS_STORE_PASSWORD: ${{ secrets.ZOMAOS_RELEASE_STORE_PASSWORD }}
          ZOMAOS_KEY_ALIAS: ${{ secrets.ZOMAOS_RELEASE_KEY_ALIAS }}
          ZOMAOS_KEY_PASSWORD: ${{ secrets.ZOMAOS_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease
      - name: Verify legacy v1 signing and package metadata
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --min-sdk-version 16 "$APK"
          "$APKSIGNER" verify --verbose --min-sdk-version 16 "$APK" | tee /tmp/signature.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/signature.txt
          "$AAPT" dump badging "$APK" | head -n 5
          sha256sum "$APK" | tee app/build/outputs/apk/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ZomaOS-signed-release-candidate
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          retention-days: 30
