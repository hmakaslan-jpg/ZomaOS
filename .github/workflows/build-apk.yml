name: ZomaOS V15.3 Clean Verified Build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Enforce clean source resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCLEAN'
          from pathlib import Path
          import shutil
          root=Path('app/src/main')
          allowed={'master_carbon.jpg','master_electric.jpg','master_pearl.jpg','zoma_icon.png'}
          res=root/'res'
          for p in sorted(res.rglob('*'),reverse=True):
              if p.is_file() and not (p.parent==res/'drawable-nodpi' and p.name in allowed):
                  print('Pruning legacy resource:',p)
                  p.unlink()
          for p in sorted(res.rglob('*'),reverse=True):
              if p.is_dir() and not any(p.iterdir()):p.rmdir()
          themes=root/'assets'/'themes'
          if themes.exists():
              print('Removing duplicate theme assets:', themes)
              shutil.rmtree(themes)
          assert not themes.exists(), 'Duplicate theme directory still exists'
          java=root/'java'
          for p in java.rglob('*.java'):
              if p.relative_to(java).as_posix()!='com/zoma/os/MainActivity.java':
                  print('Pruning legacy Java:',p)
                  p.unlink()
          found={p.name for p in (res/'drawable-nodpi').iterdir() if p.is_file()}
          assert found==allowed, f'Unexpected resource set: {found}'
          print('Clean resources verified:',sorted(found))
          PYCLEAN
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Verify built APK contains only expected images
        shell: bash
        run: |
          python3 - <<'PYVERIFY'
          import zipfile
          apk='app/build/outputs/apk/debug/app-debug.apk'
          allowed={'master_carbon.jpg','master_electric.jpg','master_pearl.jpg','zoma_icon.png'}
          with zipfile.ZipFile(apk) as z:
          imgs=[n for n in z.namelist() if n.lower().endswith(('.png','.jpg','.jpeg','.webp'))]
          names={n.rsplit('/',1)[-1] for n in imgs}
          print('APK images:', imgs)
          assert names==allowed and len(imgs)==4, f'Unexpected or duplicate APK images: {imgs}'
          assert not any(n.startswith('assets/themes/') for n in z.namelist()), 'Duplicate theme assets found'
          print('APK bytes:', __import__('os').path.getsize(apk))
          PYVERIFY
      - uses: actions/upload-artifact@v4
        with:
          name: ZomaOS_V15_3_Clean_Verified_APK
          path: app/build/outputs/apk/debug/app-debug.apk
